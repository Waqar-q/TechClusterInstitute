name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build
        run: ./gradlew assembleDebug 2>&1 | tee build.log; BUILD_EXIT=${PIPESTATUS[0]}; echo "exit_code=$BUILD_EXIT" >> $GITHUB_OUTPUT; exit $BUILD_EXIT

      - name: Write errors to file
        if: failure()
        run: |
          echo "Build failed at $(date)" > build-error.txt
          echo "Exit code: ${{ steps.build.outputs.exit_code }}" >> build-error.txt
          echo "====" >> build-error.txt
          grep -i -B3 -A10 "error:" build.log >> build-error.txt 2>/dev/null || tail -300 build.log >> build-error.txt 2>/dev/null
          git config user.name "CI Bot"
          git config user.email "ci@bot.local"
          git add build-error.txt
          git commit -m "build: capture error output [skip ci]" || true
          git push

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TechClusterInstitute-Debug
          path: app/build/outputs/apk/debug/*.apk
